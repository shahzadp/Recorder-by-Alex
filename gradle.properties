# --- Lean build config (mirrors the sibling projects on this machine) ---
# This machine has repeatedly OOM'd with Gradle's defaults, which fork a
# Gradle daemon plus a separate Kotlin daemon. Collapse the build into a
# single JVM and disable the non-essential background services.

kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.vfs.watch=false
org.gradle.parallel=false
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
